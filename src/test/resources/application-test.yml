spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ip_user}
    password: ${DB_PASSWORD:ip_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

  flowable:
    database-schema-update: false
    check-process-definitions: false

jwt:
  secret: testSecretKey1234567890AbcDefGhijKlMnOp
  expiration-ms: 3600000
  auth-cache-ttl-minutes: 30

env: test
